name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk onn-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: onn-launcher-apk
          path: onn-launcher.apk

      # Keeps one rolling "latest" release so the download link never changes:
      # https://github.com/<owner>/<repo>/releases/download/latest/onn-launcher.apk
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest onn-launcher.apk \
            --title "Latest build" \
            --notes "Build #${GITHUB_RUN_NUMBER} from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}." \
            --target "${GITHUB_SHA}" \
            --latest
